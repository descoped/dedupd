[package]
name = "dedupd-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin client for the dedupd daemon's control API, exposed to Swift through UniFFI"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = "0.32.2"
ureq = { version = "3.5.1", features = ["json"] }
