# How dedupd can put a model into Ollama.
#
# Methods are tried in order, cheapest first. `tested` lists the versions of
# the app a method was run against; another version is not refused, it is
# reported as not tried.

app = "ollama"
name = "Ollama"
otherwise = "Ollama cannot run this format"

[detect]
bundle = "Ollama.app"
command = "Contents/Resources/ollama"

# The GGUF's sha256 is the layer digest, so the stored file is the blob.
[[method]]
id = "clone"
built = true
cost = "none"
formats = ["gguf"]
says = "Shares the stored file"
tested = ["0.40.16"]

[method.unless]
split = "Ollama cannot use a GGUF that is split into parts"

# An MLX weights file as a clone with only its index rewritten (the
# `ollama_mlx` module; spikes/ollama_mlx_shared_clone.py shows why it works).
# Ollama's own import of an MLX model with another bit width succeeds, and
# the model then fails to load. dedupd asks the installed Ollama about each
# model before it places it, so the app has to be there.
[[method]]
id = "clone-with-rewritten-index"
built = true
needs_app = true
cost = "megabytes"
formats = ["mlx"]
bits = [4, 8]
says = "Shares the stored files; only the index of each weights file is new"
tested = ["0.40.16"]
