name: CodeQL Actions

# The GitHub Actions workflows, when they change; and once a week.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analyze.yml
    with:
      language: actions
      build-mode: none
      runs-on: ubuntu-latest
