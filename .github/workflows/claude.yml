name: Claude

# Two jobs, one action:
#
# - `review` reads a pull request when it is opened or reopened and posts one
#   review. It changes nothing.
# - `respond` answers an `@claude` mention from the owner or a collaborator, in
#   a pull request or an issue: sort out a finding, or fix it and push the fix.
#
# `reopened` is the way to have a pull request reviewed again. Deliberately not
# `synchronize`: that would review every push to every open pull request.
#
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN (made by `claude setup-token`, stored
# with `gh secret set CLAUDE_CODE_OAUTH_TOKEN`) and the Claude GitHub app
# installed on this repository.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, reopened]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# A newer opened or reopened event cancels a review that is still running.
# Only for `pull_request`: the action's own "Claude Code is working…" comment
# arrives as `issue_comment` in this same group, and cancelling on that would
# stop the review that wrote it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every opened pull request, Renovate's too, so its token cannot
  # write to the repository: a review reads the diff and posts a comment.
  review:
    # No check on who opened it: the instruction is the fixed text below (the
    # pull request's own text never becomes the instruction), and Renovate
    # opens pull requests as an outsider, so a check would end its reviews.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'claude[bot]'
    runs-on: ubuntu-latest
    # A review cut off by the timeout still reports success with a half-filled
    # comment, so the ceiling is generous.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # Comments Claude creates or edits from here on belong to this review.
      - name: Note when the review starts
        run: echo "REVIEW_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e  # v1 (v1.0.257)
        with:
          # The model is named, not inherited. `Agent` is denied so the review
          # is one pass: a subagent still running when the main turn ends never
          # reports, and nothing is posted. The read-only gh and git commands
          # are granted because the action refuses every Bash call by default.
          claude_args: >-
            --model opus
            --disallowedTools "Agent"
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR. It may change the Rust daemon and command line (crates/), the macOS app in Swift (macos-app/), or both; review every part it changes.

            First read .claude/CLAUDE.md, then each file in .claude/rules/ that applies to the files this PR changes (its Applies to line says which; macos-app.md covers macos-app/).

            Never-violate rules, from the sections Invariants and Protocol rules that are easy to get wrong in .claude/CLAUDE.md: weight files in the store are never transformed; placement is by clones, never by symlinks, hard links or copies; nothing is deleted without an explicit apply; Authorization goes to huggingface.co only; Xet stays hidden from clients; the Ollama registry redirect rules. Review against them as written there, and when you flag a violation, name the rule.

            Rust (crates/):
            - Correctness and error handling: errors carry context and reach the caller or the log, nothing is silently dropped, no unwrap or expect on input that can fail outside tests.
            - Async: no blocking file, hash or database work on the async runtime outside spawn_blocking; no std Mutex guard held across an await; a background task or a dropped request cannot leave state half-done (a flag set, a lock held).
            - All SQL stays in the db module; one flat schema and no migrations.
            - A name or path from outside (a client, the provider, a file) is checked before it is used in a path or a URL.
            - The core modules do not depend on each other in a circle (crates/dedupd-core/tests/module_cycles.rs).
            - A change to the control API comes with re-recorded fixtures (just fixtures); a change to dedupd-api or the client comes with regenerated Swift bindings.

            Swift (macos-app/), against .claude/rules/macos-app.md:
            - The app talks to the daemon only through crates/dedupd-client, through LiveDaemonClient off the main thread, and never embeds dedupd-core or opens the store.
            - Swift 6 strict concurrency: @Observable @MainActor stores, no data races, no force unwraps, try! or as! without an inline SwiftLint disable comment that says why.
            - project.yml is the source of truth: a file added, moved or removed comes with the regenerated Dedupd.xcodeproj. The generated bindings in DedupdClient/Generated are never edited by hand.
            - One event subscription feeds every screen; no polling and no second subscription. Pure logic stays out of View types.
            - Text a person types or pastes goes through ModelSpec; nothing from the daemon is shown as Markdown or a format string.
            - The canned daemon holds nothing personal (paths under /Users/example, the archive at /Volumes/Archive) and no rule of its own about which app takes what.
            - Elements a UI test reads have their accessibility text spelled out; a list row's .tag goes on last.

            Also: hardcoded values, leaked secrets, and AI attribution lines in commits or the PR body (none allowed). Docs (README.md, docs/) say what the code now does.

            The tests cannot run here: they need macOS and APFS. CI runs the Rust tests; the Swift app is built and tested locally with just app-check. Distinguish CRITICAL (must fix before merge) from SUGGESTION (non-blocking). Post one concise PR review with file:line citations, grouped by Rust and Swift when the PR changes both. If the PR is clean, say so plainly; do not manufacture issues. Complete the entire review within this run and post the consolidated review before ending; never end the turn while any review pass is deferred, backgrounded or promised for later.
          track_progress: true
          allowed_bots: 'renovate[bot]'

      # The action reports success even when no review was posted: when it
      # skips itself (a pull request that changes this file; the file must
      # match the default branch) or ends early. So the job fails unless
      # Claude created or edited a comment during this run, and that comment
      # has no unticked boxes (a run that ends early leaves them unticked).
      - name: Fail when the review did not post
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # --jq runs once per page, so each matching body is printed as one
          # JSON line and the last line over all pages is taken.
          body=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.user.login == "claude[bot]" and .updated_at >= env.REVIEW_STARTED) | .body | @json' \
            | tail -n 1 | jq -r .)
          if [ -z "$body" ]; then
            echo "::error::Claude posted no review in this run; it was skipped or failed (a pull request that changes claude.yml is never reviewed)"
            exit 1
          fi
          if printf '%s' "$body" | grep -q -- '- \[ \]'; then
            echo "::error::the review comment still has unchecked boxes; the review did not post"
            exit 1
          fi

  respond:
    # The comment or issue text becomes Claude's instruction, with a token that
    # can write and the OAuth secret, so the author must be the owner, a member
    # or a collaborator.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.user.login != 'claude[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.user.login != 'claude[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    # macOS 26 on Apple silicon, like the CI job: the code builds only there,
    # and the tests create real APFS clones. A fix can then be built and
    # tested before it is pushed. (A macOS minute costs more than a Linux one;
    # this job runs only when someone trusted writes `@claude`.)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e  # v1 (v1.0.257)
        with:
          # No prompt: the action answers the mention. Besides the read-only
          # gh and git commands it may run the Rust gate and its parts, so a
          # fix is checked here and not only by CI afterwards.
          claude_args: >-
            --model opus
            --disallowedTools "Agent"
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(just check),Bash(just fmt),Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo check:*),Bash(cargo build:*),Bash(cargo test:*)"
            --append-system-prompt "Read .claude/CLAUDE.md before changing anything. When you change Rust code, run just check and push only when it passes; say plainly when it does not. Never add AI attribution to a commit message or to pull request text: no Generated-with line, no Co-Authored-By line, no session link. The macOS app (macos-app/) cannot be built or tested here; when a fix needs a change there, say what is left to do."
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
