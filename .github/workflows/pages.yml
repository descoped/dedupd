name: Documentation site

# Builds the documentation site (site/, a krantho static site whose pages are
# the markdown files in docs/) and publishes it to GitHub Pages when either
# changes on main. Pages is set to publish from GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and one that has started always finishes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: each page is dated by its file's last commit
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      # Where Pages serves the site (https://docs.dedupd.com), which every page's
      # canonical link, the sitemap and robots.txt name. Pages reports the
      # address with http:// until HTTPS is enforced on the custom domain; the
      # site is served over https either way, so the build always says https.
      - run: KRANTHO_SITE_BASE_URL="https://${BASE_URL#*://}" pnpm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
