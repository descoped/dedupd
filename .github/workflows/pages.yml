name: Documentation site

# Builds the documentation site (site/, a krantho static site whose pages are
# the markdown files in docs/) and publishes it to GitHub Pages when either
# changes on main, and when a release is published, so the home page's
# download button leads to the new disk image. Pages is set to publish from
# GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# One deployment at a time, and one that has started always finishes
concurrency:
  group: pages-${{ github.event_name == 'release' && 'release' || 'build' }}
  cancel-in-progress: false

jobs:
  # A release runs on its tag, and only main may deploy to Pages: start this
  # workflow again on main, which then builds with the new release
  on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: each page is dated by its file's last commit
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      # Where Pages serves the site (https://dedupd.com), which every page's
      # canonical link, the sitemap and robots.txt name. Pages reports the
      # address with http:// until HTTPS is enforced on the custom domain; the
      # site is served over https either way, so the build always says https.
      # The token lets the build ask GitHub for the latest release's disk image.
      - run: KRANTHO_SITE_BASE_URL="https://${BASE_URL#*://}" pnpm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
