name: CodeQL Rust

# The Rust workspace, when it changes; and once a week.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - '!crates/**/*.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/codeql-rust.yml'
      - '.github/workflows/codeql-analyze.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - '!crates/**/*.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/codeql-rust.yml'
      - '.github/workflows/codeql-analyze.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analyze.yml
    with:
      language: rust
      build-mode: none
      runs-on: ubuntu-latest
