name: CodeQL analysis

# One CodeQL scan of one language, called by the codeql-<language>.yml
# workflows. Each of those runs only when its own sources change, and once a
# week. They replace GitHub's default setup, which scanned every language on
# every pull request, docs included, and took half an hour for Swift.
on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      build-mode:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      timeout-minutes:
        required: false
        type: number
        default: 30

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The app's build compiles the Rust client and the daemon as well
      # (macos-app/scripts/build-rust-client.sh and bundle-daemon.sh, with
      # these same commands). Built here, before CodeQL starts watching, the
      # build it watches finds them done instead of compiling them traced.
      - if: inputs.language == 'swift'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - if: inputs.language == 'swift'
        run: |
          cargo build --release -p dedupd-client
          cargo build --release -p dedupd-client --features bindgen --bin uniffi-bindgen
          cargo build --release -p dedupd
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}
      - if: inputs.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          # The category the default setup used, so the alerts it raised
          # carry on.
          category: /language:${{ inputs.language }}
