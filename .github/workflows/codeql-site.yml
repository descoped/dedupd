name: CodeQL site

# The documentation site's code (site/, TypeScript), when it changes; and
# once a week. The pages themselves (docs/) are text and are not scanned.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/**/*.md'
      - '.github/workflows/codeql-site.yml'
      - '.github/workflows/codeql-analyze.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/**/*.md'
      - '.github/workflows/codeql-site.yml'
      - '.github/workflows/codeql-analyze.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript-typescript:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analyze.yml
    with:
      language: javascript-typescript
      build-mode: none
      runs-on: ubuntu-latest
