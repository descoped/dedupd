name: CodeQL Swift

# The macOS app's code, when it changes; and once a week.
on:
  push:
    branches: [main]
    paths:
      - 'macos-app/**'
      - '!macos-app/**/*.md'
      - '.github/workflows/codeql-swift.yml'
      - '.github/workflows/codeql-analyze.yml'
  pull_request:
    branches: [main]
    paths:
      - 'macos-app/**'
      - '!macos-app/**/*.md'
      - '.github/workflows/codeql-swift.yml'
      - '.github/workflows/codeql-analyze.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analyze.yml
    with:
      language: swift
      build-mode: autobuild
      runs-on: macos-26
      timeout-minutes: 60
