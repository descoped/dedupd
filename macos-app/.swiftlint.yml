included:
  - Dedupd
  - DedupdTests
  - DedupdUITests

excluded:
  - Dedupd.xcodeproj
  - DedupdClient
  - build

disabled_rules:
  - trailing_comma
  - opening_brace
  - identifier_name

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - unowned_variable_capture
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 3
  function_level: 3
