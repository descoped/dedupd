<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -52 284 104" role="img" aria-label="dedupd">
  <title>dedupd</title>
  <style>g{stroke:#141414}@media (prefers-color-scheme:dark){g{stroke:#f2f2f2}}</style>
  <!-- d e d u and the monogram as the last letter, so it reads dedupd. Every
       bowl has radius 20 and the stroke is 4; letters stand 60 apart; an
       ascender or descender reaches 30 past the bowl. -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <circle r="20"/><path d="M20 20V-50"/>
    <path d="M40 0H80A20 20 0 1 0 74.142 14.142"/>
    <circle cx="120" r="20"/><path d="M140 20V-50"/>
    <path d="M160 -20V0A20 20 0 0 0 200 0M200 -20V20"/>
    <circle cx="240" r="20"/><path d="M220 -20V50M260 20V-50"/>
  </g>
</svg>
